name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore Encurtador.slnx

      - name: Compilar
        run: dotnet build Encurtador.slnx --no-restore -c Release

      - name: Rodar testes
        run: dotnet test Encurtador.slnx --no-build -c Release